[versions]

trixnity = "5.8.1"

### build ###
downloadGradlePlugin = "5.7.0" # https://github.com/michel-kraemer/gradle-download-task/releases

### native bindings ###
trixnityOlmBinaries = "2.0.4" # https://gitlab.com/connect2x/trixnity/trixnity-olm-binaries/-/releases
trixnityOpensslBinaries = "1.0.6" # https://gitlab.com/connect2x/trixnity/trixnity-openssl-binaries/-/releases

### vodozemac - checksums come from the registry, web has to be sha1 for yarn ###
vodozemac-tag = "v0.1.3" # https://gitlab.com/connect2x/trixnity/trixnity-vodozemac-binaries/-/packages/
vodozemac-jvmJni = "422f3995bdb79a81ed849354ff77c973ef71b66f455175a58e60866e8eeb66fa"
vodozemac-androidJni = "c7b69138ee6c6ac59785a9eefa3e3f4c2e005d5bcc6280e30c1527976d57024d"
vodozemac-native = "2142f31071d3238f060cfe91bd281eedd82680774793a7a44d644cdefee16c02"
vodozemac-webNpm = "746386b61df38bab7fb2853a43aacea22e871e75"

### libraries ###
okio = "3.18.1" # https://lysine.dev/okio/changelog/

### databases ###
exposed = "1.4.0" # https://github.com/JetBrains/Exposed/releases
hikari = "7.1.0" # https://github.com/brettwooldridge/HikariCP/tags
r2dbc-h2 = "1.1.0.RELEASE" # https://github.com/r2dbc/r2dbc-h2/releases
r2dbc-postgres = "1.1.2.RELEASE" # https://github.com/pgjdbc/r2dbc-postgresql/releases

### testing ###
testContainers = "2.0.5" # https://github.com/testcontainers/testcontainers-java/releases
openjdkJol = "0.17" # https://github.com/openjdk/jol/tags

[libraries]

### libraries ###
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-nodefilesystem = { module = "com.squareup.okio:okio-nodefilesystem", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }

### databases ###
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }

r2dbc-h2 = { module = "io.r2dbc:r2dbc-h2", version.ref = "r2dbc-h2" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbc-postgres" }

### testing ###
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testContainers" }
testcontainers-junitJupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testContainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testContainers" }

openjdk-jol = { module = "org.openjdk.jol:jol-core", version.ref = "openjdkJol" }

[plugins]
download = { id = "de.undercouch.download", version.ref = "downloadGradlePlugin" }
